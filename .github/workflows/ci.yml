name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fast, no-dependency check that runs before the slower browser
      # install/test steps below - fails early if a documented test case
      # (docs/test-cases/*.md) has no matching Playwright test, or if a
      # Playwright test references a TC-ID with no matching doc entry.
      # No npm install needed - plain Node, no dependencies.
      - name: Check Playwright automation status vs documentation
        run: node scripts/automation-status.js --check

      - name: Install dependencies
        working-directory: playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      # Same reasoning as the API job's health check - this is a shared,
      # no-SLA demo environment (docs/automation-notes.md), so skip rather
      # than fail the build outright if it's unreachable.
      - name: Health check (environment availability)
        id: health_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://automationexercise.com/)
          if [ "$STATUS" != "200" ]; then
            echo "Application is unreachable (HTTP $STATUS). Skipping the rest of the suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # playwright.config.ts already sets retries: 2 in CI for individual
      # test flakiness (isCI check) - no separate outer retry loop needed
      # here, unlike the Newman job's whole-collection retry.
      - name: Run Playwright tests
        if: steps.health_check.outputs.skip == 'false'
        working-directory: playwright
        run: npx playwright test --project=chromium --reporter=list,html

      - name: Upload Playwright report
        if: always() && steps.health_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14

  api-tests:
    name: API tests (Postman/Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Health check (environment availability)
        id: health_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://automationexercise.com/api/productsList)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Application is unreachable (HTTP $STATUS). Skipping the rest of the suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The app is known to be flaky (see docs/automation-notes.md) - a single 302 doesn't
      # mean it's down, so we retry the whole collection up to 3 times rather than failing
      # the build on the first transient redirect. Each Postman test already distinguishes
      # an environment hiccup (302) from a real assertion failure in its own report.
      #
      # --iteration-count 2 runs the collection twice per attempt to demonstrate repeatability:
      # each iteration generates fresh unique test data and the Teardown folder cleans up
      # after itself, so a second pass shouldn't collide with the first or leave data behind.
      - name: Run API test collection (with retry on environment instability)
        if: steps.health_check.outputs.skip == 'false'
        working-directory: postman
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            if newman run ecommerce-api.postman_collection.json \
                -e environments/production.postman_environment.json \
                --iteration-count 2 \
                --delay-request 500 \
                --reporters cli,junit \
                --reporter-junit-export newman-report.xml; then
              echo "Passed on attempt $attempt."
              exit 0
            fi
          done
          echo "Failed after 3 attempts."
          exit 1

      - name: Upload Newman report
        if: always() && steps.health_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: postman/newman-report.xml
